---
# Log in with operator username/password, create or download a named API token,
# print it, and save it for the other example playbooks.
#
#   uv run ansible-playbook examples/generate_token.yml -e @vco-vault.yml --ask-vault-pass
#
# Later playbooks load examples/.tokens/<SHA-256 of vco_host>.token.
# Override vco_token_file to save it elsewhere. Do not commit the token file.
- name: Generate, print, and save an operator API token
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/auth.yml
  tasks:
    - name: Require operator credentials
      ansible.builtin.assert:
        that:
          - not ansible_check_mode
          - vco_username | default('') | length > 0
          - vco_password | default('') | length > 0
        fail_msg: >-
          Provide vco_username and vco_password through Ansible Vault.
          This playbook writes a token; do not run it with --check.

    - name: Create or download the named API token
      no_log: true
      module_defaults:
        ansible.builtin.uri:
          body_format: json
          return_content: true
          follow_redirects: none
          validate_certs: "{{ vco_verify_ssl | default(true) }}"
          timeout: 30
      block:
        - name: Log in with the operator username and password
          ansible.builtin.uri:
            url: "{{ vco_base_url }}/portal/rest/login/operatorLogin"
            method: POST
            body:
              username: "{{ vco_username }}"
              password: "{{ vco_password }}"
            status_code: [200, 302]
          register: vco_login
          changed_when: false

        - name: Require an authenticated session cookie
          ansible.builtin.assert:
            that: vco_login.cookies['velocloud.session'] | default('') | length > 0

        - name: Get the operator user ID from the authenticated session
          ansible.builtin.uri:
            url: "{{ vco_base_url }}/portal/vco/getSessionContext"
            method: GET
            body_format: raw
            headers:
              Cookie: "{{ vco_login.cookies_string }}"
          register: vco_session

        - name: Require an operator user ID
          ansible.builtin.assert:
            that: vco_session.json.userId | default(0) | int > 0

        - name: Look for an existing named token before creating one
          ansible.builtin.uri:
            url: "{{ vco_base_url }}/portal/rest/operatorUser/getApiTokens"
            method: POST
            headers:
              Cookie: "{{ vco_login.cookies_string }}"
            body:
              id: "{{ vco_session.json.userId | int }}"
              with: [usernames, tenantName]
          register: vco_existing_tokens
          changed_when: false

        - name: Find tokens matching this example's token name
          ansible.builtin.set_fact:
            vco_matching_tokens: "{{ vco_existing_tokens.json | selectattr('name', 'equalto', vco_token_name) | list }}"

        - name: Reject ambiguous token names
          ansible.builtin.assert:
            that: vco_matching_tokens | length <= 1

        - name: Create an operator API token if the named token does not exist
          ansible.builtin.uri:
            url: "{{ vco_base_url }}/portal/rest/network/createApiToken"
            method: POST
            headers:
              Cookie: "{{ vco_login.cookies_string }}"
            body:
              name: "{{ vco_token_name }}"
              description: Reusable token for the velocloud.api collection example
              lifetimeMs: "{{ vco_token_lifetime_ms | int }}"
              operatorUserId: "{{ vco_session.json.userId | int }}"
          when: vco_matching_tokens | length == 0
          changed_when: true

        - name: Look up the token ID after creation or reuse
          ansible.builtin.uri:
            url: "{{ vco_base_url }}/portal/rest/operatorUser/getApiTokens"
            method: POST
            headers:
              Cookie: "{{ vco_login.cookies_string }}"
            body:
              id: "{{ vco_session.json.userId | int }}"
              with: [usernames, tenantName]
          register: vco_tokens
          changed_when: false

        - name: Select the token to download
          ansible.builtin.set_fact:
            vco_matching_tokens: "{{ vco_tokens.json | selectattr('name', 'equalto', vco_token_name) | list }}"

        - name: Require exactly one token with a numeric ID
          ansible.builtin.assert:
            that:
              - vco_matching_tokens | length == 1
              - vco_matching_tokens[0].id | int > 0

        - name: Download the API token using the login session
          ansible.builtin.uri:
            url: "{{ vco_base_url }}/portal/rest/network/downloadApiToken"
            method: POST
            headers:
              Cookie: "{{ vco_login.cookies_string }}"
            body:
              id: "{{ vco_matching_tokens[0].id | int }}"
          register: vco_downloaded_token
          changed_when: false

        - name: Require a nonempty API token
          ansible.builtin.assert:
            that: vco_downloaded_token.json.token | default('') | trim | length > 0

        - name: Check the token file's parent directory
          ansible.builtin.stat:
            path: "{{ vco_token_file | dirname }}"
          register: token_parent

        - name: Create a private directory for the saved token
          ansible.builtin.file:
            path: "{{ vco_token_file | dirname }}"
            state: directory
            mode: "0700"
          when: not token_parent.stat.exists

        - name: Save the token for subsequent playbook runs
          ansible.builtin.copy:
            dest: "{{ vco_token_file }}"
            content: "{{ vco_downloaded_token.json.token | trim }}\n"
            mode: "0600"

    - name: Display the saved API token
      ansible.builtin.debug:
        msg:
          - "Saved API token to {{ vco_token_file }}"
          - "API token: {{ lookup('file', vco_token_file) | trim }}"
